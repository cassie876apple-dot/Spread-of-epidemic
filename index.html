<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SIR Epidemic Simulation</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>🦠 SIR Epidemic Simulation</h1>

<div class="controls">
    <label>Infection rate (β)</label>
    <input type="range" id="beta" min="0" max="1" step="0.01" value="0.3">

    <label>Recovery rate (γ)</label>
    <input type="range" id="gamma" min="0" max="1" step="0.01" value="0.1">

    <label>Initial infected</label>
    <input type="range" id="initialI" min="1" max="30" step="1" value="5">

    <button id="run">Start Simulation</button>
</div>

<div class="canvas-wrapper">
    <canvas id="animationCanvas" width="400" height="300"></canvas>
    <canvas id="chartCanvas" width="400" height="300"></canvas>
</div>

<!-- ⚠️ 一定在这里 -->
<script src="script.js"></script>

</body>
</html>
