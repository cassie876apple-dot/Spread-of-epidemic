<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SIR Epidemic Simulation</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>SIR Epidemic Simulation</h1>

    <label>Infection rate (beta)</label>
    <input type="range" id="beta" min="0" max="1" step="0.01" value="0.3">

    <label>Recovery rate (gamma)</label>
    <input type="range" id="gamma" min="0" max="1" step="0.01" value="0.1">

    <label>Initial infected</label>
    <input type="range" id="initialI" min="1" max="50" step="1" value="5">

    <button id="run">Start Simulation</button>

    <br><br>

    <label>Day:</label>
    <input type="range" id="daySlider" min="0" max="49" value="0">
    <span id="dayLabel">0</span>
    
    <canvas id="animationCanvas" width="400" height="400"></canvas>
    <canvas id="chartCanvas" width="400" height="200"></canvas>

    <script src="script.js"></script>
</body>
</html>
