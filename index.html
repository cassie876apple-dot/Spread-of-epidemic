<!DOCTYPE html>
<html>
<head>
    <title>SIR Epidemic Model</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>SIR Epidemic Simulation</h1>

    <label>Infection rate (beta)</label>
    <input type="range" id="beta" min="0" max="1" step="0.01">

    <label>Recovery rate (gamma)</label>
    <input type="range" id="gamma" min="0" max="1" step="0.01">

    <label>Initial infected</label>
    <input type="range" id="initialI" min="1" max="100" step="1">

    <button id="run">Start Simulation</button>

    <canvas id="chart"></canvas>

    <script src="script.js"></script>
</body>
</html>
