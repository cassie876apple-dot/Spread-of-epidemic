<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SIR Epidemic Simulation</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>SIR Epidemic Simulation</h1>

<div class="controls">
    <label>Infection rate (β)</label>
    <input type="range" id="beta" min="0" max="1" step="0.01" value="0.3">

    <label>Recovery rate (γ)</label>
    <input type="range" id="gamma" min="0" max="1" step="0.01" value="0.1">

    <label>Initial infected</label>
    <input type="range" id="initialI" min="1" max="20" step="1" value="3">

    <button id="run">Start Simulation</button>
</div>

<canvas id="animationCanvas" width="500" height="300"></canvas>
<canvas id="chartCanvas" width="500" height="300"></canvas>

<!-- timeline (hidden at first) -->
<div id="timelineContainer">
    <input type="range" id="timeline" min="0" max="0" step="1">
</div>

<script src="script.js"></script>
</body>
</html>
